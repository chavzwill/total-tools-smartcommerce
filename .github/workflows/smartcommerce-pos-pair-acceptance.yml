name: SmartCommerce POS Pair Acceptance

on:
  pull_request:
    paths:
      - 'smartcommerce-ai/src/server/posOrderDelivery.ts'
      - 'smartcommerce-ai/tests/pos-live-pair-acceptance.mjs'
      - 'smartcommerce-ai/tests/pos-live-pair-fixture.cjs'
      - '.github/workflows/smartcommerce-pos-pair-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      POS_TEST_USER: admin
      POS_TEST_PASSWORD: 'SmartCommerce-Pair-Test!2026'
      TURSO_DATABASE_URL: ''
      TURSO_AUTH_TOKEN: ''
      POS_ACCEPTANCE_POS_ROOT: ${{ github.workspace }}/.acceptance/pos-system
      POS_ACCEPTANCE_FIXTURE_PATH: ${{ runner.temp }}/smartcommerce-pos-fixture.json
      POS_ACCEPTANCE_HTTP_ORIGIN: http://127.0.0.1:3001

    steps:
      - name: Checkout SmartCommerce
        uses: actions/checkout@v4

      - name: Checkout current POS master
        run: |
          git clone --depth 1 --branch master https://github.com/chavzwill/pos_system.git .acceptance/pos-system
          printf 'POS acceptance SHA: '
          git -C .acceptance/pos-system rev-parse HEAD

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            smartcommerce-ai/package-lock.json
            .acceptance/pos-system/package-lock.json

      - name: Install SmartCommerce dependencies
        working-directory: smartcommerce-ai
        run: npm ci --no-audit --no-fund

      - name: Install POS dependencies
        working-directory: .acceptance/pos-system
        run: npm ci --no-audit --no-fund

      - name: Bootstrap isolated POS database
        working-directory: .acceptance/pos-system
        run: |
          key="$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('base64'))")"
          printf 'POS_SETTINGS_ENCRYPTION_KEY=%s\n' "$key" >> "$GITHUB_ENV"
          rm -f pos.db pos.db-shm pos.db-wal
          POS_SETTINGS_ENCRYPTION_KEY="$key" node scripts/ci-runtime-bootstrap.js

      - name: Seed isolated SmartCommerce acceptance fixtures
        working-directory: .acceptance/pos-system
        run: node "$GITHUB_WORKSPACE/smartcommerce-ai/tests/pos-live-pair-fixture.cjs" seed

      - name: Start isolated POS runtime
        working-directory: .acceptance/pos-system
        run: |
          node server.js > "$RUNNER_TEMP/pos-acceptance.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/pos-acceptance.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3001/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/pos-acceptance.log"
          exit 1

      - name: Exercise live SmartCommerce to POS order pair
        working-directory: smartcommerce-ai
        run: node tests/pos-live-pair-acceptance.mjs

      - name: Show POS diagnostics on failure
        if: failure()
        run: cat "$RUNNER_TEMP/pos-acceptance.log" || true

      - name: Stop isolated POS runtime
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/pos-acceptance.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/pos-acceptance.pid")" 2>/dev/null || true
          fi
