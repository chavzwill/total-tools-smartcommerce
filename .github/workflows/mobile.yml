name: Mobile foundation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - 'smartcommerce-ai/src/server/mobile/**'
      - 'smartcommerce-ai/api/mobile/**'
      - 'smartcommerce-ai/api/integrations/pos/**'
      - 'smartcommerce-ai/migrations/*pos_driver*'
      - 'smartcommerce-ai/migrations/*mobile*'
      - '.github/workflows/mobile.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      # Mobile integration tests import the real sibling SmartCommerce API
      # handlers. Their Node dependencies resolve from smartcommerce-ai,
      # not the separate mobile workspace.
      - name: Install SmartCommerce API test dependencies
        working-directory: smartcommerce-ai
        run: npm ci --no-audit --no-fund
      - name: Install mobile workspace dependencies
        run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run export --workspace @smartcommerce/customer
      - run: npm run export --workspace @smartcommerce/courier
