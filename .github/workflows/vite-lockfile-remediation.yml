name: Vite lockfile remediation validation

# Candidate-only build: does not change the repository or deploy.
on:
  pull_request:
    paths:
      - '.github/workflows/vite-lockfile-remediation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: smartcommerce-ai
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate reproducible candidate from npm registry
        run: npm install --package-lock-only --save-exact --save-dev vite@8.3.5 --ignore-scripts --no-audit --no-fund
      - name: Verify clean install against regenerated lockfile
        run: npm ci --no-audit --no-fund
      - name: Require patched production dependency audit
        run: npm audit --audit-level=high --omit=dev
      - name: Verify TT AI signed client contract
        run: npm run test:tt-ai-service-client
      - name: Run complete release gate, typechecks and production bundle
        run: npm run build
      - name: Export tested package and lockfile for reviewed commit
        if: success()
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          for (const name of ["package.json","package-lock.json"]) {
            console.log("TT_AI_VERIFIED_FILE_BEGIN:"+name);
            process.stdout.write(readFileSync(name,"utf8")+"\n");
            console.log("TT_AI_VERIFIED_FILE_END:"+name);
          }
          NODE
