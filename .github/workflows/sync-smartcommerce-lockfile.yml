name: Sync SmartCommerce Lockfile

on:
  push:
    branches:
      - security/audit-integrity-chain
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartcommerce-ai
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security/audit-integrity-chain

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --omit=dev --no-fund || true

      - name: Commit lockfile update
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize SmartCommerce dependency lockfile"
          git push origin HEAD:security/audit-integrity-chain
