name: POS Sync Database

on:
  push:
    branches: ['feature/website-pos-commerce-sync']
  pull_request:
    paths:
      - 'smartcommerce-ai/**'
      - '.github/workflows/pos-sync-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: pos_sync_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: smartcommerce-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: smartcommerce-ai/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Transport and route contract regressions
        run: npm run test:pos-commerce-sync
      - name: Real PostgreSQL concurrency and replay regressions
        run: npm run test:pos-order-database
        env:
          POS_TEST_DATABASE_URL: postgresql://postgres:local_test_only@127.0.0.1:5432/pos_sync_test
